<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&family=Martian+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;background:#f2f4f7;font-family:"Barlow Semi Condensed",sans-serif;color:#0b1624;display:grid;grid-template-rows:1fr 190px;overflow:hidden}
.top{background:#0a5fc4;color:#fff;padding:56px 72px 0;position:relative}
.bar{position:absolute;left:0;right:0;top:0;height:48px;border-bottom:1px solid rgba(255,255,255,.3);display:flex;align-items:center;padding:0 72px;font-size:22px;color:#dce8f8;gap:40px}
h1{margin-top:44px;font-size:128px;line-height:.92;font-weight:700;letter-spacing:-.02em}
.role{margin-top:26px;font-size:44px;font-weight:500}
.tags{margin-top:14px;font-size:28px;color:#dce8f8}
.strip{display:grid;grid-template-columns:repeat(6,1fr);border-top:2px solid #0b1624;position:relative}
.strip::before{content:"";position:absolute;left:0;top:-2px;height:4px;width:100%;background:#17a05d}
.c{padding:30px 22px;border-right:1px solid #c4ccd6;position:relative}
.c:last-child{border-right:0}
.c::before{content:"";position:absolute;left:22px;top:-12px;width:20px;height:20px;border-radius:50%;background:#17a05d;border:3px solid #f2f4f7}
.k{font:500 20px "Martian Mono",monospace;color:#44546a}
.n{margin-top:10px;font-size:38px;font-weight:600}
.stamp{position:absolute;right:72px;bottom:34px;transform:rotate(-3.5deg);border:6px solid #0e7a44;color:#0e7a44;padding:6px 26px;font-size:64px;font-weight:700;letter-spacing:.1em;background:rgba(242,244,247,.95)}
</style></head><body>
<div class="top"><div class="bar"><span>Portfolio</span><span>Bangkok, Thailand</span></div>
<h1>Thanapon Pruektan</h1><p class="role">Senior Full Stack Developer</p><p class="tags">WMS · SAP · E-commerce · Web3 · AI</p><div class="stamp">POSTED</div></div>
<div class="strip">
<div class="c"><div class="k">1.1</div><div class="n">Receive</div></div>
<div class="c"><div class="k">1.3</div><div class="n">Pick</div></div>
<div class="c"><div class="k">1.2</div><div class="n">Reconcile</div></div>
<div class="c"><div class="k">1.4</div><div class="n">Label</div></div>
<div class="c"><div class="k">2.2</div><div class="n">Pay</div></div>
<div class="c"><div class="k">2.4</div><div class="n">Support</div></div>
</div></body></html>
